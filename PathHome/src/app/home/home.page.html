
<ion-content [fullscreen]="true" class="welcome-page">
  <main class="welcome-screen">

    <!-- Logo oficial de PathHome -->
    <section class="welcome-brand" aria-label="Bienvenido a PathHome">
      <img
        class="welcome-logo"
        src="assets/img/logo_splash.png"
        alt="PathHome, una familia y un hogar"
      />

      <h1 class="welcome-tagline">
        CADA HISTORIA MERECE UN HOGAR
      </h1>
    </section>

    <!-- Indicadores de bienvenida -->
    <nav class="welcome-indicators" aria-label="Página de bienvenida">
      <span class="indicator active" aria-current="page"></span>
      <span class="indicator"></span>
      <span class="indicator"></span>
    </nav>

    <!-- Decoración inferior -->
    <img
      class="welcome-waves"
      src="assets/img/img7.jpg"
      alt=""
      aria-hidden="true"
    />

  </main>
</ion-content>
